<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit user – Spotify DB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='users.css') }}">
</head>
<body class="user-form-page">
<div class="user-form-container">

    <header class="user-form-header">
        <a href="{{ url_for('get_users') }}" class="back-link">← Back to Users</a>
        <h1>Edit user</h1>
        <p class="subtitle">
            Update the information for this user.
        </p>
    </header>

    <section class="user-form-card">
        {% if error_message %}
        <div class="error-box">
            {{ error_message }}
        </div>
        {% endif %}

        <form method="post" class="user-form-grid">
            <div class="form-row">
                <label>User ID</label>
                <input type="text" value="{{ user.user_id }}" readonly>
            </div>

            <div class="form-row">
                <label for="username">Username <span class="required">*</span></label>
                <input id="username" type="text" name="username"
                       value="{{ user.username }}" required>
            </div>

            <div class="form-row">
                <label for="email">Email</label>
                <input id="email" type="email" name="email"
                       value="{{ user.email }}">
            </div>

            <div class="form-row">
                <label for="phone_number">Phone number</label>
                <input id="phone_number" type="text" name="phone_number"
                       value="{{ user.phone_number }}">
            </div>

            <div class="form-row">
                <label for="dob">Date of birth</label>
                <input id="dob" type="date" name="dob" value="{{ user.dob }}">
            </div>

            <div class="form-row">
                <label for="genre_id">Favourite genre</label>
                <select id="genre_id" name="genre_id">
                    <option value="">-- No favourite genre --</option>
                    {% for g in genres %}
                    <option value="{{ g.genre_id }}"
                        {% if user.genre_id == g.genre_id %}selected{% endif %}>
                        {{ g.genre_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="artist_id">Favourite artist</label>
                <select id="artist_id" name="artist_id">
                    <option value="">-- No favourite artist --</option>
                    {% for a in artists %}
                    <option value="{{ a.artist_id }}"
                        {% if user.artist_id == a.artist_id %}selected{% endif %}>
                        {{ a.artist_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Newsletter</label>
                <div class="radio-group">
                    <label><input type="radio" name="newsletter" value="yes"> Yes</label>
                    <label><input type="radio" name="newsletter" value="no" checked> No</label>
                </div>
            </div>

            <div class="form-row form-row-full">
                <button type="submit" class="btn primary-btn">Update user</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
