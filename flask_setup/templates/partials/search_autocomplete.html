<style>
    .autocomplete-container {
      position: relative;
    }
  
    .autocomplete-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #2a2a2a;
      border: 1px solid #444;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
  
    .autocomplete-results.show {
      display: block;
    }
  
    .autocomplete-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #333;
    }
  
    .autocomplete-item:last-child {
      border-bottom: none;
    }
  
    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: #1db954;
      color: white;
    }
  
    .autocomplete-item .primary-text {
      font-weight: 500;
    }
  
    .autocomplete-item .secondary-text {
      font-size: 0.85em;
      color: #888;
    }
  
    .autocomplete-item:hover .secondary-text,
    .autocomplete-item.active .secondary-text {
      color: #ddd;
    }
  
    .btn-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
  
    .btn-clear:hover {
      color: #e74c3c;
    }
  
    .search-input {
      padding-right: 35px;
      width: 100%;
    }
  
    .no-results {
      padding: 10px 12px;
      color: #888;
      font-style: italic;
    }
  </style>
  
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // Find all autocomplete containers and set them up
    document.querySelectorAll('.autocomplete-container').forEach(container => {
      const config = {
        searchUrl: container.dataset.searchUrl,
        dataKey: container.dataset.key,
        idField: container.dataset.idField,
        nameField: container.dataset.nameField,
        secondaryField: container.dataset.secondaryField
      };
  
      const searchInput = container.querySelector('.search-input');
      const hiddenInput = container.querySelector('input[type="hidden"]');
      const resultsContainer = container.querySelector('.autocomplete-results');
      const clearBtn = container.querySelector('.btn-clear');
  
      if (!searchInput || !hiddenInput || !resultsContainer) return;
  
      let debounceTimer;
      let activeIndex = -1;
  
      searchInput.addEventListener('input', function() {
        const query = this.value.trim();
        clearTimeout(debounceTimer);
  
        if (query.length < 2) {
          resultsContainer.classList.remove('show');
          return;
        }
  
        debounceTimer = setTimeout(() => {
          fetch(`${config.searchUrl}?q=${encodeURIComponent(query)}&limit=10`)
            .then(res => res.json())
            .then(data => {
              resultsContainer.innerHTML = '';
              activeIndex = -1;
  
              const items = data[config.dataKey];
              if (items && items.length > 0) {
                items.forEach(item => {
                  const div = document.createElement('div');
                  div.className = 'autocomplete-item';
                  div.dataset.id = item[config.idField];
                  div.dataset.name = item[config.nameField];
  
                  let html = `<span class="primary-text">${item[config.nameField]}</span>`;
                  if (config.secondaryField && item[config.secondaryField]) {
                    html += ` <span class="secondary-text">- ${item[config.secondaryField]}</span>`;
                  }
                  div.innerHTML = html;
  
                  div.addEventListener('click', () => {
                    searchInput.value = item[config.nameField];
                    hiddenInput.value = item[config.idField];
                    hiddenInput.dispatchEvent(new Event('change'));
                    hiddenInput.dispatchEvent(new Event('valueSelected'));
                    resultsContainer.classList.remove('show');
                  });

                  resultsContainer.appendChild(div);
                });
              } else {
                resultsContainer.innerHTML = '<div class="no-results">No results found</div>';
              }
  
              resultsContainer.classList.add('show');
            })
            .catch(err => console.error('Search error:', err));
        }, 300);
      });
  
      searchInput.addEventListener('keydown', function(e) {
        const items = resultsContainer.querySelectorAll('.autocomplete-item');
  
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          activeIndex = Math.min(activeIndex + 1, items.length - 1);
          items.forEach((item, i) => item.classList.toggle('active', i === activeIndex));
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          activeIndex = Math.max(activeIndex - 1, 0);
          items.forEach((item, i) => item.classList.toggle('active', i === activeIndex));
        } else if (e.key === 'Enter' && activeIndex >= 0) {
          e.preventDefault();
          const selectedItem = items[activeIndex];
          if (selectedItem) {
            searchInput.value = selectedItem.dataset.name;
            hiddenInput.value = selectedItem.dataset.id;
            hiddenInput.dispatchEvent(new Event('change'));
            hiddenInput.dispatchEvent(new Event('valueSelected'));
            resultsContainer.classList.remove('show');
          }
        } else if (e.key === 'Escape') {
          resultsContainer.classList.remove('show');
        }
      });
  
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          searchInput.value = '';
          hiddenInput.value = '';
          resultsContainer.classList.remove('show');
        });
      }
  
      document.addEventListener('click', e => {
        if (!container.contains(e.target)) {
          resultsContainer.classList.remove('show');
        }
      });
    });
  });

  document.addEventListener('DOMContentLoaded', function() {
    // Find all dependent selects
    const dependentSelects = document.querySelectorAll('.dependent-select');
    
    dependentSelects.forEach(function(select) {
        const dependsOn = select.dataset.dependsOn;
        const fetchUrl = select.dataset.fetchUrl;
        const dataKey = select.dataset.key;
        const idField = select.dataset.idField;
        const nameField = select.dataset.nameField;
        
        // Find the parent field (could be a hidden input for search fields)
        const parentInput = document.querySelector(`input[name="${dependsOn}"]`);
        
        if (!parentInput) return;
        
        // Store the initial value if editing
        const initialValue = select.value;
        
        // Function to load options
        function loadOptions(parentId) {
            if (!parentId) {
                select.innerHTML = '<option value="">Select an artist first...</option>';
                select.disabled = true;
                return;
            }
            
            select.disabled = true;
            select.innerHTML = '<option value="">Loading...</option>';
            
            fetch(fetchUrl + parentId)
                .then(response => response.json())
                .then(data => {
                    const items = data[dataKey] || [];
                    
                    let options = '<option value="">-- Select Album --</option>';
                    items.forEach(item => {
                        const selected = (item[idField] == initialValue) ? 'selected' : '';
                        options += `<option value="${item[idField]}" ${selected}>${item[nameField]}</option>`;
                    });
                    
                    if (items.length === 0) {
                        options = '<option value="">No albums found for this artist</option>';
                    }
                    
                    select.innerHTML = options;
                    select.disabled = false;
                })
                .catch(err => {
                    console.error('Error loading options:', err);
                    select.innerHTML = '<option value="">Error loading albums</option>';
                });
        }
        
        // Listen for changes on parent input
        parentInput.addEventListener('change', function() {
            loadOptions(this.value);
        });
        
        // Also listen for custom event from search autocomplete
        parentInput.addEventListener('valueSelected', function() {
            loadOptions(this.value);
        });
        
        // Load initial options if parent has a value (for edit forms)
        if (parentInput.value) {
            loadOptions(parentInput.value);
        }
    });
});
  </script>
