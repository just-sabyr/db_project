<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users – Spotify DB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='users.css') }}">
</head>
<body>

    <a href="/" class="back-link">← Back to Home</a>

    <h1>Users</h1>
    <p class="subtitle">List of all users stored in the Spotify-style database.</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>DOB</th>
                <th>Genre ID</th>
                <th>Artist ID</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.user_id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.phone_number }}</td>
                <td>{{ user.dob }}</td>
                <td>{{ user.genre_id }}</td>
                <td>{{ user.artist_id }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
