<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genres – Spotify DB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='users.css') }}">
</head>
<body>
    <a href="/" class="back-link">← Back to Home</a>

    <h1>Genres</h1>
    <p class="subtitle">List of music genres stored in the database.</p>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Parent genre</th>
                    <th>Genre name</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                {% for g in genres %}
                <tr>
                    <td>{{ g.genre_id }}</td>
                    <td>{{ g.parent_genre }}</td>
                    <td>{{ g.genre_name }}</td>
                    <td>{{ g.genre_description }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
