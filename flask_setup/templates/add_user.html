<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create new user – Spotify DB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='users.css') }}">
</head>
<body class="user-form-page">
<div class="user-form-container">

    <header class="user-form-header">
        <a href="{{ url_for('get_users') }}" class="back-link">← Back to Users</a>
        <h1>Create new user</h1>
        <p class="subtitle">
            Add a new listener profile to the Spotify-style database.
        </p>
    </header>

    <section class="user-form-card">
        <form method="post" class="user-form-grid">
            <div class="form-row">
                <label for="username">Username <span class="required">*</span></label>
                <input id="username" type="text" name="username"
                       required placeholder="username">
            </div>

            <div class="form-row">
                <label for="email">Email</label>
                <input id="email" type="email" name="email"
                       placeholder="user@example.com">
            </div>

            <div class="form-row">
                <label for="phone_number">Phone number</label>
                <input id="phone_number" type="text" name="phone_number"
                       placeholder="+90...">
            </div>

            <div class="form-row">
                <label for="dob">Date of birth</label>
                <input id="dob" type="date" name="dob">
            </div>

            <div class="form-row">
                <label for="genre_id">Favourite genre</label>
                <select id="genre_id" name="genre_id">
                    <option value="">-- No favourite genre --</option>
                    {% for g in genres %}
                    <option value="{{ g.genre_id }}">{{ g.genre_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="artist_id">Favourite artist</label>
                <select id="artist_id" name="artist_id">
                    <option value="">-- No favourite artist --</option>
                    {% for a in artists %}
                    <option value="{{ a.artist_id }}">{{ a.artist_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label>Newsletter</label>
                <div class="radio-group">
                    <label><input type="radio" name="newsletter" value="yes"> Yes</label>
                    <label><input type="radio" name="newsletter" value="no" checked> No</label>
                </div>
            </div>

            <div class="form-row form-row-full">
                <button type="submit" class="btn primary-btn">Save user</button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
