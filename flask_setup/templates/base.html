<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Spotify Database Dashboard{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <style>
    .navbar {
      background-color: #1f2937;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 500;
      opacity: 0.85;
    }

    .navbar a:hover { opacity: 1; text-decoration: underline; }

    /* ✅ Active page highlight */
    .navbar a.active {
      opacity: 1;
      text-decoration: underline;
      font-weight: 700;
    }

    .navbar-left a { margin-left: 0; font-weight: 800; opacity: 1; }
    .navbar-right { display: flex; align-items: center; gap: 6px; }

    /* ✅ Welcome username */
    .welcome {
      color: #d1d5db;
      margin-left: 18px;
      font-weight: 600;
      opacity: 0.95;
      white-space: nowrap;
    }

    .page-wrap { padding: 30px; }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="navbar-left">
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">
        Spotify DB
      </a>
    </div>

    <div class="navbar-right">
      <!-- ✅ Active link highlighting using request.endpoint -->
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
      <a href="{{ url_for('get_genres') }}" class="{% if request.endpoint == 'get_genres' %}active{% endif %}">Genres</a>
      <a href="{{ url_for('get_artists') }}" class="{% if request.endpoint == 'get_artists' %}active{% endif %}">Artists</a>
      <a href="{{ url_for('get_albums') }}" class="{% if request.endpoint == 'get_albums' %}active{% endif %}">Albums</a>
      <a href="{{ url_for('get_tracks') }}" class="{% if request.endpoint == 'get_tracks' %}active{% endif %}">Tracks</a>
      <a href="{{ url_for('get_audio_features') }}" class="{% if request.endpoint == 'get_audio_features' %}active{% endif %}">
        Audio Features
      </a>

      {% if session.get("logged_in") %}
        <!-- ✅ Welcome username -->
        <span class="welcome">Welcome, {{ session.get("username", "User") }}</span>

        <!-- ✅ Role-based visibility in navbar -->
        {% if session.get("role") == "admin" %}
          <a href="{{ url_for('get_users') }}" class="{% if request.endpoint == 'get_users' %}active{% endif %}">Users</a>
          <a href="{{ url_for('stats_page') }}" class="{% if request.endpoint == 'stats_page' %}active{% endif %}">Stats</a>
        {% endif %}

        <a href="{{ url_for('logout') }}" class="{% if request.endpoint == 'logout' %}active{% endif %}">Logout</a>
      {% else %}
        <a href="{{ url_for('login') }}" class="{% if request.endpoint == 'login' %}active{% endif %}">Login</a>
      {% endif %}
    </div>
  </div>

  <div class="page-wrap">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
