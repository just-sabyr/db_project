<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Spotify Database Dashboard{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <style>
    .navbar {
      background-color: #1f2937;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 500;
      opacity: 0.85;
    }

    .navbar a:hover { opacity: 1; text-decoration: underline; }

    /* ✅ Active page highlight */
    .navbar a.active {
      opacity: 1;
      text-decoration: underline;
      font-weight: 700;
    }

    .navbar-left a { margin-left: 0; font-weight: 800; opacity: 1; }
    .navbar-right { display: flex; align-items: center; gap: 6px; }

    /* ✅ Welcome username */
    .welcome {
      color: #d1d5db;
      margin-left: 18px;
      font-weight: 600;
      opacity: 0.95;
      white-space: nowrap;
    }

    .page-wrap { padding: 30px; }
  </style>
</head>

<body>

  <!-- Navbar -->
<div class="navbar">
  <div class="navbar-left">
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">BasedDATA</a>
  </div>

  <div class="navbar-right">
    <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
       <a href="{{ url_for('genres.get_genres') }}" class="{% if request.path.startswith('/genres') %}active{% endif %}">Genres</a>
    <a href="{{ url_for('artists.get_artists') }}" class="{% if request.path.startswith('/artists') %}active{% endif %}">Artists</a>
    <a href="{{ url_for('albums.get_albums') }}" class="{% if request.path.startswith('/albums') %}active{% endif %}">Albums</a>
    <a href="{{ url_for('tracks.get_tracks') }}" class="{% if request.path.startswith('/tracks') %}active{% endif %}">Tracks</a>
    <a href="{{ url_for('audiofeatures.get_audio_features') }}" class="{% if request.path.startswith('/audiofeatures') %}active{% endif %}">Audio</a>

    {% if session.get("logged_in") and session.get("role") == "admin" %}
      <a href="{{ url_for('users.get_users') }}" class="{% if request.path.startswith('/users') %}active{% endif %}">Users</a>
      <a href="{{ url_for('stats_page') }}" class="{% if request.path.startswith('/stats') %}active{% endif %}">Stats</a>
      <a href="{{ url_for('choose_add') }}" class="{% if request.path.startswith('/choose/add') %}active{% endif %}">Add</a>
      <a href="{{ url_for('choose_edit') }}" class="{% if request.path.startswith('/choose/edit') %}active{% endif %}">Edit</a>
    {% endif %}

    {% if session.get("logged_in") %}
      <span style="color:#1db954; margin-left:18px; font-weight:600;">
       {{ session.get("username") }}
      </span>
      <a href="{{ url_for('logout') }}" style="margin-left:14px;">Logout</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="{% if request.endpoint == 'login' %}active{% endif %}">Login</a>
    {% endif %}
  </div>
</div>

  <div class="page-wrap">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
